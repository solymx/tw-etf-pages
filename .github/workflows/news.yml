# Today's Taiwan finance news + full-site rebuild and GitHub Pages deploy.
# 07:00 Taiwan = 23:00 UTC daily; 17:00 Taiwan weekends = 09:00 UTC Sat/Sun.
# Weekday 17:00 news is included in "Update ETF holdings" (run_live).
# Same concurrency group as holdings so push/deploy do not race.
name: Update Taiwan finance news

on:
  schedule:
    - cron: "0 23 * * *"    # daily 07:00 Taiwan = 23:00 UTC
    - cron: "0 9 * * 0,6"   # Sat/Sun 17:00 Taiwan = 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Fetch news and rebuild site
        run: python -m tw_etf_pages news

      - name: Commit news + site (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news site
          if git diff --staged --quiet; then
            echo "No news/site changes to commit"
          else
            git commit -m "chore: update Taiwan finance news $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
