# Taiwan active ETF watchlist — edit this file to add/remove tickers.
timezone: Asia/Taipei

# Placeholder filter (Uni issuer noise): exclude from change categories when
# shares <= max_shares AND weight_pct < max_weight_pct. Snapshot JSON still
# retains full holdings with is_placeholder tagged.
placeholder:
  max_shares: 1000
  max_weight_pct: 0.01
  # Policy: exclude from first-buy / increase / decrease / full-exit tables
  exclude_from_changes: true

